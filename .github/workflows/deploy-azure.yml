# Publie le site sur Azure Static Web Apps à chaque mise à jour de la branche main.
# Prérequis (voir DEPLOIEMENT.md) : secret AZURE_STATIC_WEB_APPS_API_TOKEN (jeton de déploiement Azure).
name: Déploiement Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les fichiers publics
        run: |
          if grep -q "À compléter" mentions-legales.html; then
            echo "::warning::Les mentions légales contiennent encore des champs « À compléter »."
          fi
          # Seuls les fichiers du site sont publiés (pas le README, ni outils/, ni .github/)
          mkdir public
          cp -r index.html ressources.html mentions-legales.html 404.html staticwebapp.config.json assets data salaries it public/

      - name: Publier sur Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: public
          skip_app_build: true
          skip_api_build: true
