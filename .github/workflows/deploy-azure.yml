# Déploie le site sur Azure Static Web Apps à chaque mise à jour de la branche main.
# Prérequis (voir DEPLOIEMENT.md) :
#   - secret  AZURE_STATIC_WEB_APPS_API_TOKEN : jeton de déploiement de la ressource Azure
#   - variable AZURE_TENANT_ID               : ID du locataire Microsoft Entra de l'entreprise
name: Déploiement Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les fichiers publics
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if ! [[ "$AZURE_TENANT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::La variable AZURE_TENANT_ID est absente ou invalide (voir DEPLOIEMENT.md)."
            exit 1
          fi
          # Seuls les fichiers du site sont publiés (pas le README, ni outils/, ni .github/)
          mkdir public
          cp -r index.html ressources.html assets data salaries it public/
          sed "s/__AZURE_TENANT_ID__/$AZURE_TENANT_ID/" staticwebapp.config.json > public/staticwebapp.config.json

      - name: Publier sur Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: public
          skip_app_build: true
          skip_api_build: true
